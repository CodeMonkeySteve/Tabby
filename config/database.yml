default: &default
  url:  <%= ENV['POSTGRESQL_URL'].presence || Kreds.fetch!(:postgresql, :url) %>
  pool: <%= ENV['RAILS_MAX_THREADS'] || Kreds.fetch!(:postgresql, :pool) { 5 } %>
  encoding: unicode
  timeout: 5000

development:
  <<: *default

test:
  <<: *default
  url: postgres://postgres@localhost/tabby_test

production:
  <<: *default
